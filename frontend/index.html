<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Detector</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- MediaPipe Libraries for Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- PAGE 1: SETUP PAGE -->
  <div id="page-1" class="page">
    <h1>Lazy Detector</h1>
    <p>How many hours are you going to study today?</p>
    <div class="input-group">
      <input type="number" id="study-hours" min="1" max="12" value="2">
      <button id="start-btn">Start Studying</button>
    </div>
  </div>

  <!-- PRANK POPUP MODAL -->
  <div id="prank-modal" class="modal hidden">
    <div class="modal-content prank-content">
      <!-- The image you selected -->
      <img src="./photo.png" alt="Study Hard!" class="prank-img">
      
      <!-- The dynamic message about the time increase -->
      <p id="prank-message"></p>
      
      <button id="prank-ok-btn">OK... Fine.</button>
    </div>
  </div>

  <!-- PAGE 2: STUDY ROOM PAGE -->
  <div id="page-2" class="page hidden">
    <div class="webcam-container">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="status-badge">Initializing AI...</div>
    </div>

    <!-- Bottom Right Timer -->
    <div id="timer-box">
      <span>Time Remaining:</span>
      <h2 id="timer-display">00:00:00</h2>
    </div>

    <!-- Quit Modal Popup -->
    <div id="quit-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Giving up so soon?</h2>
        <p>Choose your way out:</p>
        <button id="pay-btn">Pay ₹394 & Exit</button>
        <button id="free-btn">Free Exit</button>
      </div>
    </div>
  </div>

  <!-- Floating Quit Button (Moved outside page-2 so position:fixed uses full viewport) -->
  <button id="quit-btn" class="hidden">Quit</button>

  <script src="script.js"></script>
</body>
</html>
